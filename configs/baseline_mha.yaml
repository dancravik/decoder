# Базовый конфиг: классический decoder-only GPT (MHA + manual attention + dense FFN)
# API key для Comet ML берётся из env COMET_API_KEY (не храним в git!)
project_name: "decoder-only-shakespeare"
experiment_name: "baseline_mha"
seed: 42

data:
  train_text: "TinyShakespeare/train.csv"
  val_text: "TinyShakespeare/validation.csv"
  test_text: "TinyShakespeare/test.csv"

structural:
  d_model: 384
  n_layers: 6
  n_heads: 6
  d_ff: 1536
  seq_len: 256
  dropout: 0.1
  weight_decay: 0.01
  attention: "mha"      # mha | mqa | gqa
  use_sdpa: false       # true -> FlashAttention (SDPA kernel)
  ffn: "dense"          # dense | moe

training:
  batch_size: 32
  lr: 6e-4
  optimizer: "AdamW"
  warmup_steps: 100
  max_steps: 5000
  eval_interval: 200
  sample_interval: 500
  ckpt_interval: 1000
